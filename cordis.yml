# dsh-maplay overlay for `dsh web` / `dsh --profile web`.
#
# Usage:
#   dsh web --patch /path/to/dsh-maplay/cordis.yml
#
# The plugin spawns the maplay Vite dev server (if nothing is already
# listening on port 8992), loads a map JSON into its session, registers the
# full maplay tool suite, and — most importantly — makes the maplay chat
# page the dsh frontend: opening http://127.0.0.1:3080 lands directly on
# /maplay/chat (left: live map, right: conversation), and chat requests are
# bridged to dsh's own model route (ctx.llm), so no API key entry is needed.
# /maplay/playground still shows the full-screen scene.
#
# NOTE: the plugin `name` must be an ABSOLUTE path — relative names resolve
# against the dsh profile directory (~/.dsh/profiles/web/), not this file.
# The `!!js` expressions below are evaluated with Node globals in scope:
#   MAPPLAY_DIR   maplay checkout directory (default /Users/vcvcvn/workspace/maplay)
#   MAPPLAY_MAP   map JSON to load (default <MAPPLAY_DIR>/demo.json)
#
# 发布安装后（`dsh plugin add dsh-maplay`），把 name 改成包名即可，见 README 发布章节。

- insert:
    - id: maplay
      name: /Users/vcvcvn/workspace/dsh-maplay/lib/index.js
      config:
        baseUrl: http://127.0.0.1:8992
        spawn: true
        maplayDir: !!js (process.env.MAPPLAY_DIR || '/Users/vcvcvn/workspace/maplay')
        port: 8992
        host: 127.0.0.1
        mapFile: !!js (process.env.MAPPLAY_MAP || (process.env.MAPPLAY_DIR || '/Users/vcvcvn/workspace/maplay') + '/demo.json')
        prefix: ''
        fetchTimeoutMs: 30000
        maxBoardChars: 12000
        exposeWeb: true
        webPath: /maplay
        # chatBridge: true
        # chatSystemPrompt: 你可以在这里自定义 chat 桥使用的 System Prompt
