# dsh-maplay overlay for `dsh web` / `dsh --profile web`.
#
# Usage:
#   dsh web --patch /path/to/dsh-maplay/cordis.yml
#
# dsh-maplay is a dual-face plugin:
#   - host half (lib/index.js) runs maplay's tool executor in-process, serves
#     the built frontend from @vcvcvn/maplay, and publishes the executor under
#     the `maplay` service;
#   - browser half (lib/browser.js) registers the "地图" view tab (iframe over
#     /maplay/playground), gated on the maplay agent preset.
#
# The model-facing tools are NOT registered here — they belong to the maplay
# agent preset (dsh-maplay's tools-preset half). With `chatBridge: false` the
# dsh shell keeps `/`.
#
# The plugin is referenced by PACKAGE NAME, so it must resolve from the dsh
# profile's node_modules (e.g. `dsh plugin add dsh-maplay`, or a symlink into
# ~/.dsh/profiles/node_modules/ during local development).
#
# Optional fields:
#   mapFile     自己的地图 JSON；缺省用 @vcvcvn/maplay 自带的 demo.json
#   embedded    false 时切换为外部桥接模式（baseUrl + spawn + maplayDir 生效）

- insert:
    - id: maplay
      name: dsh-maplay
      config:
        embedded: true
        # mapFile: /绝对/路径/到/你的地图.json
        prefix: ''
        fetchTimeoutMs: 30000
        maxBoardChars: 12000
        exposeWeb: true
        webPath: /maplay
        chatBridge: false
