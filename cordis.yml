# dsh-maplay overlay for `dsh web` / `dsh --profile web`.
#
# Usage:
#   dsh web --patch /path/to/dsh-maplay/cordis.yml
#
# Default mode is EMBEDDED and fully self-contained: maplay's tool executor
# runs inside the dsh process and the built frontend is served from the
# @vcvcvn/maplay npm package. No maplay checkout, no vite, no extra process.
#
# Opening http://127.0.0.1:3080 lands directly on the maplay chat page
# (left: live map, right: conversation). Chat requests are bridged to dsh's
# own model route (ctx.llm) — no API key entry needed. /maplay/playground
# shows the full-screen scene, animated over SSE from the in-process session.
#
# NOTE: the plugin `name` must be an ABSOLUTE path — relative names resolve
# against the dsh profile directory (~/.dsh/profiles/web/), not this file.
# After `dsh plugin add dsh-maplay`, use the bare package name instead (see
# README "发布 / 给别人用").
#
# Optional fields:
#   mapFile     自己的地图 JSON；缺省用 @vcvcvn/maplay 自带的 demo.json
#   embedded    false 时切换为外部桥接模式（baseUrl + spawn + maplayDir 生效）
#   chatSystemPrompt  自定义 chat 桥的 System Prompt

- insert:
    - id: maplay
      name: /Users/vcvcvn/workspace/dsh-maplay/lib/index.js
      config:
        embedded: true
        # mapFile: /绝对/路径/到/你的地图.json
        prefix: ''
        fetchTimeoutMs: 30000
        maxBoardChars: 12000
        exposeWeb: true
        webPath: /maplay
        chatBridge: true
        # chatSystemPrompt: 自定义 System Prompt
