# dsh-maplay overlay for `dsh headless` (one-shot, non-interactive runs).
#
# Usage:
#   dsh --profile headless --patch /path/to/dsh-maplay/cordis.headless.yml \
#     "让乌龟慢走到胡萝卜，兔子跳到树旁"
#
# Embedded mode: the maplay executor runs inside the dsh process, so headless
# needs no maplay server, no web UI — the model drives the in-process map.

- insert:
    - id: maplay
      name: dsh-maplay
      config:
        embedded: true
        prefix: ''
        fetchTimeoutMs: 30000
        maxBoardChars: 12000
        exposeWeb: false
